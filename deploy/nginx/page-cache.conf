# Page cache for anonymous visitors.
#
# Lives at /etc/nginx/conf.d/page-cache.conf (http context, so the zone is
# declared once for every server block).
#
# WHY THIS EXISTS
#
# The minifig and set pages declare `revalidate = 21600` and never honour it:
# they also call headers() to resolve the locale from the hostname, and that
# opts a route out of static generation entirely. The proof was in the
# database -- IsrCache held four rows (favicon, icon, robots.txt, one API
# route) and not a single page.
#
# So every request rendered from scratch. On 15 September 2026 Googlebot,
# working through the ~420,000 URLs submitted with the intobrick.com move,
# reached 280 concurrent renders. The accept queue pinned at 455, the Node
# process climbed to 2.1GB and 92% CPU, and the site went down. It re-wedged
# within a minute of every restart.
#
# bot-throttle.conf capped the bleeding. This actually fixes it: the same page
# is now rendered once and served from disk until it expires.
#
# THE CACHE KEY INCLUDES $host, AND THAT IS LOAD-BEARING
#
# Ten locales live on ten subdomains serving the same paths. Keying on the URI
# alone would serve the German page to an English reader -- the same class of
# bug CLAUDE.md warns about for the ISR cache. $scheme://$host$request_uri
# keeps them separate.

proxy_cache_path /var/cache/nginx/intobrick
                 levels=1:2
                 keys_zone=pages:100m
                 max_size=2g
                 inactive=24h
                 use_temp_path=off;

# Signed-in readers must never be served another person's page, and their own
# pages must never enter the cache. nginx also refuses to cache any response
# carrying Set-Cookie, which covers the sign-in flow on its own; this covers
# the rest.
map $http_cookie $skip_page_cache {
    default                                 0;
    "~*__Secure-next-auth\.session-token"   1;
    "~*next-auth\.session-token"            1;
}
