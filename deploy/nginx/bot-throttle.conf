map $http_user_agent $crawler_bucket {
    default "";
    "~*googlebot" "bot";
    "~*bingbot" "bot";
    "~*yandexbot" "bot";
    "~*baiduspider" "bot";
    "~*semrushbot" "bot";
    "~*ahrefsbot" "bot";
    "~*mj12bot" "bot";
    "~*petalbot" "bot";
    "~*applebot" "bot";
}
# Raised from 3r/s to 10r/s on 15 September 2026, once the page cache was in
# and proven. 3r/s was a tourniquet applied during the outage, before anything
# cached: at that rate a single pass over the ~420,000 submitted URLs would
# take Googlebot over a day of continuous crawling, which is throttling the
# indexing this site depends on for traffic.
#
# 10r/s is sized against a cache MISS, the expensive case: a page renders in
# roughly 50ms, so 10/s is about half a core even if nothing is cached. Hits
# cost nginx almost nothing. Measured before raising it — Googlebot gets
# MISS then HIT on a repeat, origin at 5% CPU and load 0.37.
#
# If the origin starts queueing again, this is the first number to lower.
limit_req_zone $crawler_bucket zone=crawlers:10m rate=10r/s;
limit_req_status 429;
