# figtracker.ericksu.com -- the OLD domain. It no longer serves the site; it
# redirects to intobrick.com, permanently.
#
# Why nginx rather than Cloudflare Redirect Rules (which the migration plan
# originally called for): the redirect has to map each locale to its
# counterpart -- de.figtracker.ericksu.com must land on de.intobrick.com, not
# on the apex -- and that needs a dynamic expression, which this zone's free
# plan does not allow. A static Cloudflare rule would have collapsed all ten
# locales onto one hostname, which Google treats as a soft 404.
#
# This must never be removed. Old links live in forum posts, BrickLink threads
# and in email already sent to users; the day this stops answering, every one
# of them becomes a dead end.

# Maps the old host to its new counterpart. The default covers the apex; the
# regex covers the nine locale subdomains and nothing else, so a stray host
# still lands somewhere sensible rather than on "..intobrick.com".
map $host $intobrick_target {
    default                                                            intobrick.com;
    "~^(?<loc>de|es|fr|it|ja|nl|pl|pt|sv)\.figtracker\.ericksu\.com$"  "${loc}.intobrick.com";
}

# Staging keeps the ordinary http->https-on-the-same-host behaviour. Listed as
# an exact server_name so it wins over the wildcard block below.
server {
    listen 80;
    listen [::]:80;
    server_name staging.figtracker.ericksu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 80 for the public hosts goes STRAIGHT to intobrick.com -- one hop, not
# two. Redirecting to https on the same host first was correct-looking and
# still ended up in the right place, but Google's Change of Address validator
# only inspects the first hop: it saw the old domain again and refused the
# move for the English property. ACME stays ahead of the redirect so this
# domain's certificate can still renew.
server {
    listen 80;
    listen [::]:80;
    server_name figtracker.ericksu.com *.figtracker.ericksu.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$intobrick_target$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.figtracker.ericksu.com;

    # Served straight from disk when the Node app is not answering -
    # during the restart at the end of a deploy, or if it crashes.
    # =503 keeps the real status code so search engines do not index
    # the maintenance text as if it were the page.
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /var/www/figtracker/public;
        try_files /maintenance.html =503;
    }


    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/figtracker.ericksu.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/figtracker.ericksu.com-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/staging.figtracker.access.log;
    error_log /var/log/nginx/staging.figtracker.error.log;

    # Next.js staging application proxy (port 3001)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Static files from Next.js build
    location /_next/static {
        alias /var/www/figtracker-staging/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://localhost:3001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# The old public site over HTTPS. Everything here is a permanent redirect;
# $request_uri carries the path AND the query string, so deep catalogue links
# and encoded theme slugs survive intact.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name figtracker.ericksu.com *.figtracker.ericksu.com;

    ssl_certificate /etc/letsencrypt/live/figtracker.ericksu.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/figtracker.ericksu.com-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/figtracker-redirect.access.log;
    error_log /var/log/nginx/figtracker.error.log;

    return 301 https://$intobrick_target$request_uri;
}
