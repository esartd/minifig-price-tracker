# intobrick.com -- the new primary domain.
#
# Kept in its own file rather than bolted onto the figtracker.ericksu.com
# server blocks, because the two need different certificates and nginx picks a
# certificate per server block, not per server_name.
#
# This is the port 80 half. It exists before the certificate does, so certbot
# has somewhere to answer its HTTP-01 challenge; everything else redirects.
server {
    listen 80;
    listen [::]:80;
    server_name intobrick.com www.intobrick.com
                de.intobrick.com es.intobrick.com fr.intobrick.com
                it.intobrick.com ja.intobrick.com nl.intobrick.com
                pl.intobrick.com pt.intobrick.com sv.intobrick.com;

    # Must come before the redirect, or certbot's challenge gets 301'd away
    # and validation fails with no useful error.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        limit_req zone=crawlers burst=20 nodelay;
        return 301 https://$host$request_uri;
    }
}

# The HTTPS half. Deliberately a near-copy of the figtracker.ericksu.com block
# rather than a shared include: during the migration both domains serve the
# same app, and one of them will eventually be deleted. A shared include would
# make that deletion a config refactor instead of removing one file.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intobrick.com www.intobrick.com
                de.intobrick.com es.intobrick.com fr.intobrick.com
                it.intobrick.com ja.intobrick.com nl.intobrick.com
                pl.intobrick.com pt.intobrick.com sv.intobrick.com;

    ssl_certificate /etc/letsencrypt/live/intobrick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intobrick.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/intobrick.access.log;
    error_log /var/log/nginx/intobrick.error.log;

    root /var/www/figtracker;

    # Branded holding page instead of a raw gateway error while Node is not
    # answering -- which it briefly is not during every deploy. This lived only
    # on the old figtracker.ericksu.com block and did not survive the rename.
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /var/www/figtracker/public;
        try_files /maintenance.html =503;
    }

    location / {
        limit_req zone=crawlers burst=20 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    location /_next/static {
        alias /var/www/figtracker/.next/static;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /avatars {
        alias /var/www/figtracker/public/avatars;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /catalog {
        alias /var/www/figtracker/public/catalog;
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    location ^~ /uploads {
        alias /var/www/figtracker/public/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        proxy_pass http://localhost:3000/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico {
        proxy_pass http://localhost:3000/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /icon.svg {
        proxy_pass http://localhost:3000/icon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        root /var/www/figtracker/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /api/health {
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
