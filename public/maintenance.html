<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FigTracker</title>
<style>
  body { margin:0; min-height:100vh; background:#fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif }
  .ft-wrap { max-width:600px; margin:0 auto; padding:96px 16px; text-align:center }
  .ft-stack { display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:28px }
  .ft-brick { width:44px; height:20px; border-radius:3px; position:relative; animation:ftrise 1.8s ease-in-out infinite }
  .ft-brick::before, .ft-brick::after { content:""; position:absolute; top:-5px; width:10px; height:6px; border-radius:2px 2px 0 0; background:inherit }
  .ft-brick::before { left:8px }
  .ft-brick::after { left:25px }
  h1 { font-size:20px; font-weight:600; color:#171717; margin:0 0 16px; letter-spacing:-0.01em }
  p { font-size:16px; color:#737373; line-height:1.6; margin:0 0 32px }
  button { padding:12px 24px; font-size:16px; font-weight:600; color:#fff; background:#3b82f6; border:none; border-radius:8px; cursor:pointer }
  @keyframes ftrise { 0% { transform:translateY(6px); opacity:.2 } 40%,100% { transform:translateY(0); opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .ft-brick { animation:none } }
</style>
</head>
<body>
<div class="ft-wrap">
  <div class="ft-stack" role="status" aria-live="polite"><div class="ft-brick" style="background:#f59e0b;animation-delay:0.6s"></div><div class="ft-brick" style="background:#22c55e;animation-delay:0.4s"></div><div class="ft-brick" style="background:#3b82f6;animation-delay:0.2s"></div><div class="ft-brick" style="background:#ef4444;animation-delay:0s"></div></div>
  <h1 id="ft-title">Snapping in a few new bricks</h1>
  <p id="ft-body">FigTracker is updating. This page will reload itself in a moment.</p>
  <button type="button" onclick="location.reload()" id="ft-reload">Reload now</button>
</div>
<script>
(function () {
  var copy = {"en":{"updatingTitle":"Snapping in a few new bricks","updatingBody":"FigTracker is updating. This page will reload itself in a moment.","updatingSlow":"This is taking longer than usual. Hang tight.","reload":"Reload now","errorTitle":"Something went wrong","errorBody":"We hit an unexpected problem loading this page.","retry":"Try again","home":"Go home"},"de":{"updatingTitle":"Wir setzen noch ein paar Steine ein","updatingBody":"FigTracker wird aktualisiert. Diese Seite lädt sich in einem Moment neu.","updatingSlow":"Das dauert länger als gewöhnlich. Einen Moment noch.","reload":"Jetzt neu laden","errorTitle":"Etwas ist schiefgelaufen","errorBody":"Beim Laden dieser Seite ist ein unerwarteter Fehler aufgetreten.","retry":"Erneut versuchen","home":"Zur Startseite"},"fr":{"updatingTitle":"On ajoute quelques briques","updatingBody":"FigTracker est en cours de mise à jour. Cette page se rechargera dans un instant.","updatingSlow":"Cela prend plus de temps que d'habitude. Merci de patienter.","reload":"Recharger","errorTitle":"Une erreur s'est produite","errorBody":"Un problème inattendu est survenu lors du chargement de cette page.","retry":"Réessayer","home":"Accueil"},"es":{"updatingTitle":"Estamos encajando unas piezas nuevas","updatingBody":"FigTracker se está actualizando. Esta página se recargará en un momento.","updatingSlow":"Esto está tardando más de lo normal. Un momento más.","reload":"Recargar ahora","errorTitle":"Algo ha salido mal","errorBody":"Se ha producido un problema inesperado al cargar esta página.","retry":"Reintentar","home":"Ir al inicio"},"it":{"updatingTitle":"Stiamo incastrando qualche mattoncino","updatingBody":"FigTracker è in aggiornamento. Questa pagina si ricaricherà tra un istante.","updatingSlow":"Sta richiedendo più tempo del solito. Ancora un attimo.","reload":"Ricarica ora","errorTitle":"Qualcosa è andato storto","errorBody":"Si è verificato un problema inatteso durante il caricamento della pagina.","retry":"Riprova","home":"Vai alla home"},"nl":{"updatingTitle":"We klikken er nog wat steentjes bij","updatingBody":"FigTracker wordt bijgewerkt. Deze pagina wordt zo automatisch opnieuw geladen.","updatingSlow":"Dit duurt langer dan gewoonlijk. Nog even geduld.","reload":"Nu opnieuw laden","errorTitle":"Er is iets misgegaan","errorBody":"Er is een onverwacht probleem opgetreden bij het laden van deze pagina.","retry":"Opnieuw proberen","home":"Naar de homepage"},"pl":{"updatingTitle":"Dokładamy kilka nowych klocków","updatingBody":"FigTracker jest aktualizowany. Ta strona odświeży się za chwilę.","updatingSlow":"To trwa dłużej niż zwykle. Jeszcze chwilę.","reload":"Odśwież teraz","errorTitle":"Coś poszło nie tak","errorBody":"Podczas ładowania tej strony wystąpił nieoczekiwany problem.","retry":"Spróbuj ponownie","home":"Strona główna"},"pt":{"updatingTitle":"A encaixar algumas peças novas","updatingBody":"O FigTracker está a ser atualizado. Esta página vai recarregar dentro de momentos.","updatingSlow":"Está a demorar mais do que o habitual. Só um momento.","reload":"Recarregar agora","errorTitle":"Algo deu errado","errorBody":"Ocorreu um problema inesperado ao carregar esta página.","retry":"Tentar novamente","home":"Ir para o início"},"sv":{"updatingTitle":"Vi snäpper fast några nya bitar","updatingBody":"FigTracker uppdateras. Sidan laddas om av sig själv om en stund.","updatingSlow":"Det här tar längre tid än vanligt. Häng kvar.","reload":"Ladda om nu","errorTitle":"Något gick fel","errorBody":"Ett oväntat fel uppstod när sidan skulle laddas.","retry":"Försök igen","home":"Till startsidan"},"ja":{"updatingTitle":"ブロックを組み直しています","updatingBody":"FigTracker を更新しています。このページはまもなく自動的に再読み込みされます。","updatingSlow":"通常よりも時間がかかっています。少しお待ちください。","reload":"今すぐ再読み込み","errorTitle":"問題が発生しました","errorBody":"このページの読み込み中に予期しない問題が発生しました。","retry":"再試行","home":"ホームへ"}};
  var prefix = location.hostname.split('.')[0];
  var t = Object.prototype.hasOwnProperty.call(copy, prefix) ? copy[prefix] : copy.en;

  document.documentElement.lang = Object.prototype.hasOwnProperty.call(copy, prefix) ? prefix : 'en';
  document.getElementById('ft-title').textContent = t.updatingTitle;
  document.getElementById('ft-body').textContent = t.updatingBody;
  document.getElementById('ft-reload').textContent = t.reload;

  // nginx serves this via error_page, so the address bar still shows the
  // page the visitor actually wanted and reloading returns them to it.
  // Someone who opens /maintenance.html directly has nothing to go back
  // to, and polling would just reload this page every three seconds
  // forever — so don't poll in that case.
  if (location.pathname === '/maintenance.html') return;

  // Being served at all means the origin was down, so one successful probe
  // is genuine recovery. (The in-app boundary has to be more careful — see
  // the note in app/global-error.tsx.)
  var startedAt = Date.now();
  setInterval(function () {
    if (Date.now() - startedAt > 90000) {
      document.getElementById('ft-body').textContent = t.updatingSlow;
    }
    fetch('/?_probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (r.ok) location.reload(); })
      .catch(function () { /* still down */ });
  }, 3000);
})();
</script>
</body>
</html>
