name: Deploy to Production (Zero-Downtime)

# GitHub Actions deployment is currently disabled due to Hostinger blocking GitHub IPs
# Use manual deployment via ./deploy.sh instead
# See DEPLOYMENT.md for details
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:  # Only allow manual trigger

jobs:
  build-and-deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SKIP_ENV_VALIDATION: true

      - name: Create deployment package
        run: |
          mkdir -p deploy-package/node_modules
          cp -r .next deploy-package/
          cp package.json package-lock.json deploy-package/
          cp -r node_modules/@prisma deploy-package/node_modules/
          cp -r node_modules/.prisma deploy-package/node_modules/
          cp -r prisma deploy-package/
          cp -r public deploy-package/ 2>/dev/null || true
          tar -czf deploy-production.tar.gz -C deploy-package .

      - name: Transfer deployment package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy-production.tar.gz"
          target: "/tmp/"
          timeout: 60s
          command_timeout: 60s
          overwrite: true

      - name: Zero-downtime deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e  # Exit on any error

            cd /var/www/figtracker

            # Pre-deployment health check
            echo "📊 Pre-deployment health check..."
            curl -f http://localhost:3000/api/health || {
              echo "❌ Production not healthy before deployment - aborting"
              exit 1
            }

            # Backup current deployment
            echo "💾 Creating backup..."
            BACKUP_FILE="/root/prod-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
            tar -czf "$BACKUP_FILE" .next package.json package-lock.json

            # Extract new build to temporary directory
            echo "📦 Extracting new build..."
            mkdir -p /tmp/figtracker-new
            tar -xzf /tmp/deploy-production.tar.gz -C /tmp/figtracker-new

            # Replace old build with new build
            echo "🔄 Replacing build files..."
            rm -rf .next node_modules/@prisma node_modules/.prisma
            mv /tmp/figtracker-new/.next .
            mv /tmp/figtracker-new/node_modules/@prisma node_modules/
            mv /tmp/figtracker-new/node_modules/.prisma node_modules/
            cp /tmp/figtracker-new/package.json .
            cp /tmp/figtracker-new/package-lock.json .

            # PM2 reload - zero downtime restart
            # PM2 reloads one instance at a time, maintaining 100% uptime
            echo "🔄 PM2 reload (zero-downtime)..."
            pm2 reload figtracker --update-env

            # Post-deployment health check
            echo "🏥 Post-deployment health check..."
            sleep 5

            for i in {1..15}; do
              if curl -f http://localhost:3000/api/health; then
                echo "✅ Production deployment successful"

                # Cleanup
                rm -rf /tmp/figtracker-new
                rm /tmp/deploy-production.tar.gz

                # Keep only last 5 backups
                ls -t /root/prod-backup-*.tar.gz | tail -n +6 | xargs rm -f 2>/dev/null || true

                exit 0
              fi
              echo "⏳ Attempt $i failed, retrying in 3 seconds..."
              sleep 3
            done

            # Rollback if health check fails
            echo "❌ Health check failed - ROLLING BACK"
            tar -xzf "$BACKUP_FILE" -C /var/www/figtracker
            pm2 reload figtracker
            sleep 3

            if curl -f http://localhost:3000/api/health; then
              echo "✅ Rollback successful - old version restored"
              exit 1
            else
              echo "🚨 CRITICAL: Rollback failed - manual intervention required"
              exit 1
            fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment successful: https://figtracker.ericksu.com"
          else
            echo "❌ Production deployment failed - check logs and rollback status"
          fi
